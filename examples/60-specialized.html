<!doctype html>
<html lang="ru" data-theme="boudoir">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atelier BMS — Specialized analytics</title>
  <link rel="stylesheet" href="../atelier/chrome/index.css" />
  <link rel="stylesheet" href="../atelier/accents/core.css" />
  <link rel="stylesheet" href="../atelier/domains/index.css" />
  <link rel="stylesheet" href="../atelier/specialized/specialized.css" />
  <style>
    body { margin: 0; padding: 32px; min-height: 100vh; }
    header { display: flex; gap: 24px; align-items: baseline; flex-wrap: wrap; margin-bottom: 32px; }
    h1 { margin: 0; font-family: var(--bms-font-display); font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
    .controls { margin-left: auto; }
    select { padding: 6px 10px; border-radius: var(--bms-radius-sm); border: 1px solid var(--bms-border); background: var(--bms-surface); color: var(--bms-text); font: inherit; font-size: 13px; }
    .stack { display: grid; gap: 24px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 980px) { .row2 { grid-template-columns: 1fr; } }
    .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--bms-text-muted); margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Specialized analytics — Phase 4</h1>
    <div class="controls"><label>Theme <select id="theme"></select></label></div>
  </header>

  <div class="stack">
    <div>
      <div class="section-title">Multi-trace trend chart</div>
      <bms-trend-chart id="trend"
        label="Температуры подачи / обратки за 24 часа"
        y-unit="°C"
        x-format="hour"></bms-trend-chart>
    </div>

    <div>
      <div class="section-title">Schedule grid 7 × 24</div>
      <bms-schedule-grid id="sched"
        label="Расписание освещения зоны B (% яркости)"
        unit="%"></bms-schedule-grid>
    </div>

    <div class="row2">
      <div>
        <div class="section-title">Event log</div>
        <bms-log-viewer id="log" label="Журнал контроллера BMS-101"></bms-log-viewer>
      </div>
      <div>
        <div class="section-title">Equipment table</div>
        <bms-equipment-table id="eq"></bms-equipment-table>
      </div>
    </div>

    <div>
      <div class="section-title">Psychrometric (d-x) chart</div>
      <bms-psychrometric-chart id="psy" comfort-zone></bms-psychrometric-chart>
    </div>
  </div>

  <script type="module">
    import { listThemes, setTheme, getTheme } from '../atelier/index.js';
    const sel = document.getElementById('theme');
    for (const t of listThemes()) sel.append(new Option(t, t));
    sel.value = getTheme();
    sel.addEventListener('change', () => setTheme(sel.value));

    // ── trend chart data ──
    const trend = document.getElementById('trend');
    const N = 96;  // 24 hours × 4 / hour
    const supply = [], retn = [], outside = [];
    for (let i = 0; i < N; i++) {
      const h = i / 4;
      supply.push([h, 22 + 0.6 * Math.sin(h / 2) + (Math.random() - 0.5) * 0.4]);
      retn.push([h, 24 + 0.4 * Math.sin(h / 3 + 1) + (Math.random() - 0.5) * 0.3]);
      outside.push([h, 5 + 8 * Math.sin((h - 6) / 12 * Math.PI) + (Math.random() - 0.5) * 0.6]);
    }
    trend.setAttribute('traces', JSON.stringify([
      { label: 'приток',  color: 'rgb(120, 200, 230)', data: supply },
      { label: 'вытяжка', color: 'rgb(255, 200, 110)', data: retn },
      { label: 'улица',   color: 'rgb(180, 140, 220)', data: outside },
    ]));

    // ── schedule grid ──
    const sched = document.getElementById('sched');
    const grid = [];
    for (let d = 0; d < 7; d++) {
      const row = [];
      for (let h = 0; h < 24; h++) {
        let v = 0;
        if (d < 5) { // weekdays
          if (h >= 7 && h < 9)  v = 60;
          else if (h >= 9 && h < 18) v = 100;
          else if (h >= 18 && h < 21) v = 70;
          else if (h >= 21 && h < 23) v = 30;
        } else { // weekend
          if (h >= 10 && h < 22) v = 50;
        }
        row.push(v);
      }
      grid.push(row);
    }
    sched.setAttribute('grid', JSON.stringify(grid));

    // ── log viewer ──
    const log = document.getElementById('log');
    const sources = ['ahu-1', 'chiller-1', 'itp-1', 'lights/zone-b', 'fire/zone-3', 'scada-bridge', 'mqtt-gw'];
    const levels = ['info', 'info', 'info', 'info', 'warning', 'debug', 'error'];
    const events = [];
    const start = new Date();
    for (let i = 0; i < 240; i++) {
      const t = new Date(start - i * 47000);
      const ts = t.toLocaleTimeString('ru-RU', { hour12: false });
      const lvl = levels[Math.floor(Math.random() * levels.length)];
      const src = sources[Math.floor(Math.random() * sources.length)];
      const msg = lvl === 'error' ? `connection timeout (op-${(Math.random() * 100 | 0)})`
              : lvl === 'warning' ? `setpoint deviation Δ=${(Math.random() * 2 + 0.5).toFixed(2)}`
              : lvl === 'debug' ? `tick ${i}`
              : `event ${src} ok`;
      events.push({ time: ts, level: lvl, source: src, message: msg });
    }
    log.setAttribute('events', JSON.stringify(events));

    // ── equipment table ──
    const eq = document.getElementById('eq');
    eq.setAttribute('label', 'Оборудование 4-го этажа');
    eq.setAttribute('columns', JSON.stringify([
      { key: 'name', label: 'Имя' },
      { key: 'type', label: 'Тип' },
      { key: 'load', label: 'Нагрузка', type: 'number' },
      { key: 'hours', label: 'Наработка', type: 'number' },
    ]));
    eq.setAttribute('items', JSON.stringify([
      { name: 'FCU-401', type: 'фанкойл', status: 'ok',       load: 65, hours: 18342 },
      { name: 'FCU-402', type: 'фанкойл', status: 'ok',       load: 40, hours: 17820 },
      { name: 'FCU-403', type: 'фанкойл', status: 'warning',  load: 92, hours: 19100 },
      { name: 'AHU-4',   type: 'приточка', status: 'ok',      load: 75, hours: 22050 },
      { name: 'VFD-401', type: 'частотник', status: 'alarm',   load: 0,  hours: 4200 },
      { name: 'VAV-4-12', type: 'VAV',     status: 'ok',      load: 35, hours: 12400 },
      { name: 'PUMP-401', type: 'насос',   status: 'ok',      load: 78, hours: 18342 },
      { name: 'PUMP-402', type: 'насос',   status: 'offline', load: 0,  hours: 17890 },
    ]));

    // ── psychrometric ──
    const psy = document.getElementById('psy');
    psy.setAttribute('points', JSON.stringify([
      { t: -5,  rh: 75, label: 'наружный',   color: 'rgb(120, 180, 220)' },
      { t: 18,  rh: 35, label: 'после нагрева', color: 'rgb(255, 130, 80)' },
      { t: 22,  rh: 45, label: 'приточный',  color: 'rgb(110, 210, 140)' },
      { t: 24,  rh: 55, label: 'вытяжной',   color: 'rgb(255, 200, 110)' },
    ]));
  </script>
</body>
</html>
